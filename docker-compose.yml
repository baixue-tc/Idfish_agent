services:
  mysql:
    image: mysql:8.4
    container_name: idlefish_mysql
    environment:
      MYSQL_ROOT_PASSWORD: sql88888888
      MYSQL_DATABASE: idlefish
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:8
    container_name: idlefish_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  agent:
    build: .
    container_name: idlefish_agent
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/app
      DB_URL: mysql://root:sql88888888@mysql:3306/idlefish
      HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./db:/app/db
volumes:
  mysql_data:
  redis_data:

