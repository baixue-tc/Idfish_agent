[project]
name = "idlefish-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.10",
    "dashscope>=1.26.6",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-mineru>=0.1.3",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-mysql[aiomysql]>=3.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pkuseg>=0.0.25",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "redis>=8.1.0",
    "sentence-transformers>=5.7.0",
    "torch>=2.11.0",
    "uiautomation>=2.0.29",
]

[tool.uv.extra-build-dependencies]
pkuseg = ["numpy"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
